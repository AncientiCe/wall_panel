; Guition ESP32-S3-4848S040 (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM)
; 480x480 ST7701 RGB panel, GT911 touch, CH340 USB-UART on COM5.
; COM4 is the claude-light LilyGO: never upload or monitor there.
[env:panel4848]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_port = COM5
upload_speed = 460800
monitor_port = COM5
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.2.1
    h2zero/NimBLE-Arduino@1.4.3

; Wireless upload: `pio run -e panel4848-ota -t upload` (PC on the same Wi-Fi/LAN).
; The password comes from OTA_PASSWORD in include/secrets.h (gitignored); without
; it OTA stays off. The first OTA-enabled build must still go over USB (env panel4848).
[env:panel4848-ota]
extends = env:panel4848
upload_protocol = espota
upload_port = wall-panel.local
extra_scripts = pre:tools/ota_auth.py
